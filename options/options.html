<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Minitor Sarp - Configurações</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="options-container">
    <header class="header">
      <div class="title-group">
        <h1>Minitor Sarp</h1>
        <p>Painel de preferências e parâmetros de monitoramento</p>
      </div>
    </header>

    <main class="form-container">
      <!-- Seção 1: Frequência -->
      <section class="section">
        <h2>Monitoramento</h2>
        <div class="form-group">
          <label for="monitoringInterval">Intervalo de Verificação (segundos):</label>
          <input type="number" id="monitoringInterval" min="5" max="3600" value="30">
          <span class="hint">Frequência em que o background worker realiza checagens.</span>
        </div>

        <div class="form-group">
          <label for="targetSelector">Seletor CSS padrão do DOM:</label>
          <input type="text" id="targetSelector" value="body" placeholder=".item, #status, body">
        </div>
      </section>

      <!-- Seção 2: Notificações -->
      <section class="section">
        <h2>Notificações e Alertas</h2>
        <div class="checkbox-group">
          <label>
            <input type="checkbox" id="autoNotify" checked>
            Exibir notificações nativas do Chrome quando houver eventos
          </label>
          <label>
            <input type="checkbox" id="soundEnabled">
            Emitir alerta sonoro
          </label>
        </div>
      </section>

      <!-- Ações -->
      <div class="actions">
        <button id="btnSave" class="btn btn-primary">Salvar Preferências</button>
        <span id="saveStatus" class="save-status"></span>
      </div>
    </main>
  </div>

  <script src="options.js"></script>
</body>
</html>
